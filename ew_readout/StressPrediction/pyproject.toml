[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-prediction"
version = "0.1.0"
description = "Equivariant learning of per-atom energy-valued virial tensors and constrained graphene design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "ase>=3.27",
  "PyYAML>=6",
  "torch>=2.5,<3",
  "torch-geometric>=2.5,<3",
  "torch-scatter>=2.1,<3",
]

[project.optional-dependencies]
selection = ["dscribe>=2", "scikit-matter>=0.3", "scikit-learn>=1.3"]
test = ["pytest>=7"]

[project.scripts]
stress-prediction = "stress_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.data-files]
"share/stress-prediction" = ["README.md", "THIRD_PARTY_NOTICES.md"]
"share/stress-prediction/configs" = ["configs/*.yaml"]

"share/stress-prediction/configs/table2" = ["configs/table2/*.yaml"]
